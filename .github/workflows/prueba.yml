name: Prueba Token Self-Hosted

on: [push]

jobs:
  comparar-tokens:
    runs-on: self-hosted
    steps:
      - name: Comparar DEV_TOKEN (Secret) con LOCAL_DEV_TOKEN (Local)
        shell: powershell
        env:
          DEV_SECRET: ${{ secrets.DEV_TOKEN }}
        run: |
          $localVal = [System.Environment]::GetEnvironmentVariable('LOCAL_DEV_TOKEN', 'User')
          Write-Host "DEV_TOKEN (Secret): $env:DEV_SECRET"
          Write-Host "LOCAL_DEV_TOKEN (Local): $localVal"

          if ($env:DEV_SECRET -eq $localVal) {
            Write-Host "EXITO: Los tokens coinciden."
            exit 0
          } else {
            Write-Error "ERROR: Los tokens NO coinciden."
            exit 1
          }